services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: onyc
      POSTGRES_PASSWORD: onyc_dev_only
      POSTGRES_DB: onyc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyc -d onyc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional cache. Start with: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
